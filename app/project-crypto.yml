# Real-crypto app spec (real libsignal FFI + SealedBox store). Kept separate
# from project.yml so the fast mock build and screenshot jobs never resolve the
# libsignal submodule. Built only by the "iOS Crypto" workflow.
name: RichManCrypto
options:
  bundleIdPrefix: works.kelvins
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RichManCore:
    path: ..
  RichManCrypto:
    path: ../crypto
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  RichManCryptoApp:
    type: application
    platform: iOS
    sources:
      - Sources/RichManApp
    dependencies:
      - package: RichManCore
        product: RichManCore
      - package: MapLibre
        product: MapLibre
      - package: RichManCrypto
        product: RichManCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.kelvins.richman.crypto
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        INFOPLIST_KEY_CFBundleDisplayName: RichMan
        INFOPLIST_KEY_NSCameraUsageDescription: "QRコードを読み取って友だちを追加します。"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "現在地を地図に表示し、セキュリティゾーンの判定に使います。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG REAL_CRYPTO"
