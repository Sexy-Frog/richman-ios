# Real-crypto app spec (real libsignal FFI + SealedBox store). Kept separate
# from project.yml so the fast mock build and screenshot jobs never resolve the
# libsignal submodule. Built only by the "iOS Crypto" workflow.
name: RichManCrypto
options:
  bundleIdPrefix: works.kelvins
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RichManCore:
    path: ..
  RichManCrypto:
    path: ../crypto
  TorSupport:
    path: ../tor
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG REAL_CRYPTO"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "REAL_CRYPTO"
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      SWIFT_REFLECTION_METADATA_LEVEL: none
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
      DEPLOYMENT_POSTPROCESSING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO

targets:
  RichManCryptoApp:
    type: application
    platform: iOS
    sources:
      - Sources/RichManApp
    dependencies:
      - package: RichManCore
        product: RichManCore
      - package: MapLibre
        product: MapLibre
      - package: RichManCrypto
        product: RichManCrypto
      - package: TorSupport
        product: TorSupport
    info:
      path: Info-Crypto.plist
      properties:
        CFBundleDisplayName: RichMan
        # Export compliance: the app uses non-exempt encryption (libsignal E2EE
        # and Tor). Export classification/self-classification is completed in
        # App Store Connect.
        ITSAppUsesNonExemptEncryption: true
        NSCameraUsageDescription: "QRコードを読み取って友だちを追加します。"
        NSMicrophoneUsageDescription: "通話で音声を送受信するためにマイクを使用します。通話は端末間で暗号化され、録音は保存しません。"
        NSLocationWhenInUseUsageDescription: "プライバシーゾーンの設定と判定、およびプライバシーゾーンが有効な場合の位置確認リクエストへの1回の応答に使用します。バックグラウンドでは取得しません。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - works.kelvins.richman.refresh
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Onion relay address is injected by CI (never committed).
        RMRelayHost: $(RM_RELAY_HOST)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.kelvins.richman.crypto
        RM_RELAY_HOST: ${RM_RELAY_HOST}
        TARGETED_DEVICE_FAMILY: "1"
    postBuildScripts:
      - name: Remove DEBUG-only resources
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/map_style_direct.json"
          fi
