# Real-crypto app spec (real libsignal FFI + SealedBox store). Kept separate
# from project.yml so the fast mock build and screenshot jobs never resolve the
# libsignal submodule. Built only by the "iOS Crypto" workflow.
name: RichManCrypto
options:
  bundleIdPrefix: works.kelvins
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RichManCore:
    path: ..
  RichManCrypto:
    path: ../crypto
  TorSupport:
    path: ../tor
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG REAL_CRYPTO"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "REAL_CRYPTO"
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      # Keep reflection metadata: SwiftUI needs it to re-render on @State
      # changes. "none" produced Release builds whose UI never updated.
      SWIFT_REFLECTION_METADATA_LEVEL: "all"
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
      DEPLOYMENT_POSTPROCESSING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO

targets:
  RichManCryptoApp:
    type: application
    platform: iOS
    sources:
      - Sources/RichManApp
    dependencies:
      - package: RichManCore
        product: RichManCore
      - package: MapLibre
        product: MapLibre
      - package: RichManCrypto
        product: RichManCrypto
      - package: TorSupport
        product: TorSupport
    info:
      path: Info-Crypto.plist
      properties:
        CFBundleDisplayName: RichMan
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: standard published encryption (libsignal/Signal
        # protocol, TLS, Tor) used for the app's own messaging qualifies for the
        # mass-market exemption. "true" (non-exempt) additionally requires an
        # ITSEncryptionExportComplianceCode and fails upload (90592) without it.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "QRコードを読み取って友だちを追加します。"
        NSMicrophoneUsageDescription: "通話で音声を送受信するためにマイクを使用します。通話は端末間で暗号化され、録音は保存しません。"
        NSLocationWhenInUseUsageDescription: "プライバシーゾーンの設定と判定に使用します。位置情報は端末内で処理し、サーバーには送信しません。バックグラウンドでは取得しません。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - works.kelvins.richman.refresh
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Onion relay address is injected by CI (never committed).
        RMRelayHost: $(RM_RELAY_HOST)
        RMDirectRelayURL: https://kelvins.works/relay/
        CFBundleURLTypes:
          - CFBundleURLName: works.kelvins.richman.invite
            CFBundleURLSchemes: [richman]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.kelvins.richman.crypto
        RM_RELAY_HOST: ${RM_RELAY_HOST}
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Entitlements/RichManDebug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Entitlements/RichManRelease.entitlements
    postBuildScripts:
      - name: Remove DEBUG-only resources
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/map_style_direct.json"
          fi
