# XcodeGen spec — generates RichMan.xcodeproj on the macOS CI runner
# (`brew install xcodegen && xcodegen generate`). Hand-writing a .pbxproj is
# avoided; the project is reproducible from this file. The app depends ONLY on
# RichManCore + MapLibre so it compiles for the iOS Simulator with no signing and
# no libsignal FFI; the real-crypto build uses project-crypto.yml instead.
name: RichMan
options:
  bundleIdPrefix: works.kelvins
  deploymentTarget:
    iOS: "17.0"   # supports iOS 17 through the latest (26); built with the macos-26 runner's Xcode
  createIntermediateGroups: true

packages:
  RichManCore:
    path: ..
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # filled by CI secret for signed .ipa builds
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      SWIFT_REFLECTION_METADATA_LEVEL: none
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
      DEPLOYMENT_POSTPROCESSING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO

targets:
  RichMan:
    type: application
    platform: iOS
    sources:
      - Sources/RichManApp
    dependencies:
      - package: RichManCore
        product: RichManCore
      - package: MapLibre
        product: MapLibre
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RichMan
        # Export compliance: the app uses standard published encryption
        # (libsignal/Signal protocol, TLS, Tor) for its own messaging, which
        # qualifies for the mass-market exemption. Declaring "non-exempt"
        # (= true) requires an ITSEncryptionExportComplianceCode from App Store
        # Connect; without that code the upload fails with error 90592.
        # The annual self-classification report is filed separately.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "QRコードを読み取って友だちを追加します。"
        NSMicrophoneUsageDescription: "通話で音声を送受信するためにマイクを使用します。通話は端末間で暗号化され、録音は保存しません。"
        NSLocationWhenInUseUsageDescription: "プライバシーゾーンの設定と判定、およびプライバシーゾーンが有効な場合の位置確認リクエストへの1回の応答に使用します。バックグラウンドでは取得しません。"
        # Map tiles are served from the loopback proxy (which uses Tor), never
        # from the clearnet. Everything else stays HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - works.kelvins.richman.refresh
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Empty in the mock build; the real build injects the onion at generation.
        RMRelayHost: $(RM_RELAY_HOST)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.kelvins.richman
        TARGETED_DEVICE_FAMILY: "1"
    postBuildScripts:
      - name: Remove DEBUG-only resources
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/map_style_direct.json"
          fi
