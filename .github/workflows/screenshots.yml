name: iOS Screenshots

# Builds the app for the iOS Simulator, launches it with DEBUG-only launch
# arguments that skip onboarding and open a specific tab, then uploads a
# screenshot as an artifact. Used for visual verification without a local Mac.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings:
    name: Settings screen (Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project RichMan.xcodeproj \
            -scheme RichMan \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator
        run: |
          # App Store Connect requires a 6.9" iPhone screenshot set. Prefer an
          # available Pro Max device; fall back to any iPhone if the runner
          # image lacks one.
          UDID=$(xcrun simctl list devices available | grep -E "iPhone .*Pro Max" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          fi
          test -n "$UDID"
          echo "Simulator: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light

      - name: Install and capture screens
        run: |
          APP="app/build/Build/Products/Debug-iphonesimulator/RichMan.app"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # Retry a capture that is still the blank launch screen (rare on a
          # cold simulator). A real screen is well above 100 KB.
          snap() {
            xcrun simctl io "$UDID" screenshot "$1"
            size=$(stat -f%z "$1")
            if [ "$size" -lt 100000 ]; then
              sleep 4
              xcrun simctl io "$UDID" screenshot "$1"
            fi
          }
          shoot() {
            name="$1"
            shift
            xcrun simctl terminate "$UDID" works.kelvins.richman >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" works.kelvins.richman \
              -rm.skipOnboarding 1 -rm.demo 1 "$@" >/dev/null
            sleep 6
            snap "shots/${name}.png"
          }
          # Actual first-run intro (no skipOnboarding) and the zone tutorial step.
          xcrun simctl terminate "$UDID" works.kelvins.richman >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" works.kelvins.richman -rm.demo 1 >/dev/null
          sleep 6
          snap shots/onboarding.png
          xcrun simctl terminate "$UDID" works.kelvins.richman >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" works.kelvins.richman -rm.demo 1 \
            -rm.onboardingStep zone >/dev/null
          sleep 6
          snap shots/onboarding-zone.png
          xcrun simctl terminate "$UDID" works.kelvins.richman >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" works.kelvins.richman -rm.demo 1 \
            -rm.onboardingStep terms >/dev/null
          sleep 6
          snap shots/onboarding-terms.png
          xcrun simctl terminate "$UDID" works.kelvins.richman >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" works.kelvins.richman -rm.demo 1 \
            -rm.onboardingStep pin >/dev/null
          sleep 6
          snap shots/onboarding-pin.png
          xcrun simctl terminate "$UDID" works.kelvins.richman >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" works.kelvins.richman -rm.demo 1 \
            -rm.onboardingStep notifications >/dev/null
          sleep 6
          snap shots/onboarding-notifications.png
          shoot primer -rm.locationPrimer 1
          shoot tutorial -rm.privacyTutorial 1
          shoot duress -rm.showDuress 1
          shoot talks -rm.tab 0
          shoot peek -rm.tab 0 -rm.peek demo-alice
          shoot friends -rm.tab 1
          shoot settings -rm.tab 2 -rm.privacyTutorialSeen 1
          shoot addfriend -rm.addFriend 1
          shoot chat -rm.chat demo-alice
          shoot official -rm.chat official
          shoot group -rm.group demo-group
          shoot call -rm.call active -rm.chat demo-alice
          shoot lock -rm.locked 1

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots
          if-no-files-found: error
