name: iOS CI

# Core (Linux, free) + app (iOS Simulator, unsigned). The crypto job lives in
# crypto.yml so an app-only change does NOT trigger the ~30-min libsignal FFI
# rebuild.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-agnostic protocol core. Linux Swift container (free, == local Docker).
  core:
    name: RichManCore (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build & test RichManCore
        run: swift test -v

  # SwiftUI app — compile for the iOS Simulator. No signing / no Apple Developer
  # account, and no libsignal FFI: the app depends on RichManCore + the
  # CryptoProvider boundary (mock), so this catches all UI/Swift errors cheaply.
  app:
    name: RichMan app (iOS Simulator build)
    runs-on: macos-26
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project RichMan.xcodeproj \
            -scheme RichMan \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Info.plist carries the relay key
        working-directory: app
        run: |
          /usr/libexec/PlistBuddy \
            -c "Print :RMRelayHost" \
            build/Build/Products/Debug-iphonesimulator/RichMan.app/Info.plist
