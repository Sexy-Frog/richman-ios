name: iOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# A newer run for the same ref cancels the older one — don't waste (macOS) minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-agnostic protocol core. Runs on a Linux Swift container (free
  # minutes, and identical to the local Docker `swift:5.10` verification).
  core:
    name: RichManCore (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build & test RichManCore
        run: swift test -v

  # libsignal-backed crypto layer. macOS ONLY (the Rust FFI is Apple-only and is
  # built from source at v0.86.5). macOS runner minutes are billed (10x on
  # private repos), so this job runs only on main pushes and manual dispatch —
  # NOT on every pull_request. Trigger it by hand from the Actions tab while the
  # repo is private to control cost; make the repo public for free macOS minutes.
  crypto:
    name: RichManCrypto (macOS, libsignal FFI)
    runs-on: macos-26          # macos-14/13 retired/unavailable; 26 = current Apple Silicon
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls crypto/third_party/libsignal @ v0.86.5

      - name: Fail early if the libsignal submodule is missing
        run: |
          if [ ! -f crypto/third_party/libsignal/swift/build_ffi.sh ]; then
            echo "::error::crypto/third_party/libsignal not found."
            echo "Add it once:  git submodule add https://github.com/signalapp/libsignal crypto/third_party/libsignal && git -C crypto/third_party/libsignal checkout v0.86.5"
            exit 1
          fi

      - name: Tool versions
        run: |
          swift --version
          rustup show || true
          cargo --version || true

      - name: Build libsignal FFI (release)
        working-directory: crypto
        run: ./third_party/libsignal/swift/build_ffi.sh --release

      - name: Build & test RichManCrypto
        working-directory: crypto
        run: swift test -v

  # SwiftUI app — compile for the iOS Simulator. No signing and no Apple
  # Developer account needed (that is only for a device .ipa), and no libsignal
  # FFI: the app depends on RichManCore + the CryptoProvider boundary (mock),
  # so this catches all UI/Swift errors for free on every main push.
  app:
    name: RichMan app (iOS Simulator build)
    runs-on: macos-26
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project RichMan.xcodeproj \
            -scheme RichMan \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
