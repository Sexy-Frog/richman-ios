name: iOS CI

# Core (Linux, free) + app (iOS Simulator, unsigned). The crypto job lives in
# crypto.yml so an app-only change does NOT trigger the ~30-min libsignal FFI
# rebuild.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-agnostic protocol core. Linux Swift container (free, == local Docker).
  core:
    name: RichManCore (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build & test RichManCore
        run: swift test -v

  # SwiftUI app — compile for the iOS Simulator. No signing / no Apple Developer
  # account, and no libsignal FFI: the app depends on RichManCore + the
  # CryptoProvider boundary (mock), so this catches all UI/Swift errors cheaply.
  app:
    name: RichMan app (iOS Simulator build)
    runs-on: macos-26
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project RichMan.xcodeproj \
            -scheme RichMan \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Info.plist carries the relay key
        working-directory: app
        run: |
          /usr/libexec/PlistBuddy \
            -c "Print :RMRelayHost" \
            build/Build/Products/Debug-iphonesimulator/RichMan.app/Info.plist

      - name: Verify App Store resources (privacy manifest + app icon)
        working-directory: app
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/RichMan.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"

      - name: Verify the bundled map style is packaged
        working-directory: app
        run: |
          test -f build/Build/Products/Debug-iphonesimulator/RichMan.app/map_style_ja.json
          grep -q "__MAP_BASE__" \
            build/Build/Products/Debug-iphonesimulator/RichMan.app/map_style_ja.json
          test -f build/Build/Products/Debug-iphonesimulator/RichMan.app/map_style_direct.json
          grep -qi "#EEF1F4" \
            build/Build/Products/Debug-iphonesimulator/RichMan.app/map_style_direct.json

      # Release hardening: the shipped binary must not carry DEBUG-only assets
      # or the reserved command / location protocol verbs as plain strings.
      - name: Build Release (binary hygiene)
        working-directory: app
        run: |
          xcodebuild \
            -project RichMan.xcodeproj \
            -scheme RichMan \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Release has no DEBUG assets or reserved strings
        working-directory: app
        env:
          RESERVED: ${{ secrets.RM_RESERVED_STRINGS }}
        run: |
          APP=build/Build/Products/Release-iphonesimulator/RichMan.app
          BIN="$APP/RichMan"
          test -d "$APP"
          if [ -e "$APP/map_style_direct.json" ]; then
            echo "::error::map_style_direct.json leaked into Release"
            exit 1
          fi
          test -n "$RESERVED"
          strings -a "$BIN" > /tmp/rm_release_strings.txt
          while IFS= read -r needle; do
            [ -z "$needle" ] && continue
            if grep -Fqx -- "$needle" /tmp/rm_release_strings.txt; then
              echo "::error::Release binary contains a reserved string"
              exit 1
            fi
          done <<< "$RESERVED"
          echo "Release binary hygiene OK"
